[package]
name = "crystal_server"
version = "0.1.0"
edition = "2021"
authors = ["Crystal Porting Team"]
description = "Legend of Mir 2 game server - Rust port of OpenMir2"

[[bin]]
name = "mir2_server"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "seed_test"
path = "src/bin/seed_test.rs"

[[bin]]
name = "migrate_mirdb"
path = "src/bin/migrate_mirdb.rs"

[[bin]]
name = "db_fix"
path = "src/bin/db_fix.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Actor model
kameo = "0.20.0"

# Shared protocol definitions
mir2_shared = { path = "../SharedRust", features = ["client-parse"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
toml = "0.8"

# Error handling
thiserror = "1"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Random number generation
fastrand = "2"

# Password hashing
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

# PBKDF2 for C# password migration
pbkdf2 = "0.12"
sha1 = "0.10"
data-encoding = "2"
