# Crystal Server 配置

[network]
listen_addr = "0.0.0.0:7000"
xor_key = 170  # 0xAA
max_connections = 1024

[database]
path = "data/crystal.db"

[server]
tick_ms = 100
map_data_dir = "Daneo1989"
drop_rate = 1.0
item_timeout_secs = 30
max_drop_gold = 2000
notice_path = "Notice.txt"
death_exp_penalty_percent = 0
health_regen_weight = 10
mana_regen_weight = 10
goods_hide_added_stats = true
# NPC 二手货/回购系统（C# Settings.Goods*，#2376）
goods_on = true
goods_max_stored = 15
goods_buy_back_time_minutes = 60
goods_buy_back_max_stored = 20
archive_inactive_after_months = 12  # C# Settings.ArchiveInactiveCharacterAfterMonths（#2384）
monster_recall_enabled = true     # C# Settings.MonsterRecallEnabled（#2390）
monster_recall_range = 12         # C# Settings.MonsterRecallRange（#2390）
monster_recall_cooldown_ms = 5000 # C# Settings.MonsterRecallCooldown（#2390）

[rarity]
# 对齐 C# Settings.MonsterRarity*（#2360）：Elite 0.1% / HP 2.25 / 伤害 1.65 / 经验 2.20
elite_chance_percent = 0.1
elite_hp_multiplier = 2.25
elite_dmg_multiplier = 1.65
elite_xp_multiplier = 2.2

# Social / 行会 / 任务系统配置
# guild_creation_cost_gold = 创建行会所需金币 (master C# Guild_CreationCost)
# 默认 1_000_000,如果 [social] 段省略则用 default。
[social]
guild_creation_cost_gold = 1000000
wedding_ring_recall_enabled = true
guild_required_level = 22
newbie_guild = "NewbieGuild"
allow_new_character = true
allow_delete_character = true
allow_create_assassin = true
allow_create_archer = true
allow_new_hero = true
hero_required_level = 22  # C# Settings.Hero_RequiredLevel（#2366）
# hero_can_create_class = [true, true, true, true, true]  # 英雄可创建职业（Warrior/Wizard/Taoist/Assassin/Archer）
mail_cost_per_1k_gold = 100
mail_item_insurance_percentage = 5
mail_free_with_stamp = true
mail_capacity = 100  # C# Settings.MailCapacity（#2382）
allow_start_game = true
allow_change_password = true
allow_new_account = true
allow_login = true
guild_war_cost = 3000
guild_war_time = 180
marriage_cooldown_days = 7    # C# Settings.MarriageCooldown（#2394）
marriage_level_required = 10  # C# Settings.MarriageLevelRequired（#2394）
replace_wedring_cost = 125    # C# Settings.ReplaceWedRingCost（#2394）
lover_exp_bonus = 5           # C# Settings.LoverEXPBonus（#2394）
mentor_level_gap = 10          # C# Settings.MentorLevelGap（#2396）
mentor_exp_boost = 10          # C# Settings.MentorExpBoost（#2396）

# 攻城 / 行会领地（GT）配置（对齐 C# Settings.BuyGTGold / ExtendGT / GTSale 最低价）
[conquest]
# 对齐 C# Settings.BuyGTGold / ExtendGT（#2360）
buy_gold = 10000000
extend_gold = 1000000
gt_sale_min_price = 2000000
gt_days = 30

# 休息经验加成（C# Settings.Rested*：安全区/下线累积，BuffType.Rested +ExpRatePercent）
[rested]
period_secs = 60
buff_length_minutes = 10
exp_bonus_percent = 5
max_bonus = 24

# 精炼配置（C# Settings.Refine*，#2392）
[refine]
base_chance = 20
time_minutes = 20
increase = 1
crit_chance = 10
crit_increase = 2
wep_stat_reduce = 6
item_stat_reduce = 15
cost = 125
ore_name = "BlackIronOre"
