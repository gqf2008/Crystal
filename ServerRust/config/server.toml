# Crystal Server 配置

[network]
listen_addr = "0.0.0.0:7000"
xor_key = 170  # 0xAA
max_connections = 1024

[database]
path = "data/crystal.db"

[server]
tick_ms = 100
map_data_dir = "Daneo1989"
drop_rate = 1.0
item_timeout_secs = 30
max_drop_gold = 2000
notice_path = "Notice.txt"
death_exp_penalty_percent = 0

[rarity]
elite_chance_percent = 3
elite_hp_multiplier = 2.0
elite_dmg_multiplier = 1.5
elite_xp_multiplier = 2.0

# Social / 行会 / 任务系统配置
# guild_creation_cost_gold = 创建行会所需金币 (master C# Guild_CreationCost)
# 默认 1_000_000,如果 [social] 段省略则用 default。
[social]
guild_creation_cost_gold = 1000000
wedding_ring_recall_enabled = true
guild_required_level = 22
newbie_guild = "NewbieGuild"
allow_new_character = true
allow_delete_character = true
allow_create_assassin = true
allow_create_archer = true
allow_new_hero = true
# hero_can_create_class = [true, true, true, true, true]  # 英雄可创建职业（Warrior/Wizard/Taoist/Assassin/Archer）
mail_cost_per_1k_gold = 100
mail_item_insurance_percentage = 5
mail_free_with_stamp = true
allow_start_game = true
allow_change_password = true
allow_new_account = true
allow_login = true
guild_war_cost = 3000
guild_war_time = 180

# 攻城 / 行会领地（GT）配置（对齐 C# Settings.BuyGTGold / ExtendGT / GTSale 最低价）
[conquest]
buy_gold = 1000000
extend_gold = 500000
gt_sale_min_price = 2000000
gt_days = 30
