[package]
name = "client_macroquad"
version = "0.1.0"
edition = "2021"

[dependencies]
# Macroquad 核心
macroquad = { version = "0.4.14", features = ["audio"] }
macroquad-profiler = "0.2.0"

# 共享库 (游戏协议和数据结构)
mir2_shared = { path = "../SharedRust", features = ["client-parse"] }

# ECS 系统
hecs = "0.11.0"
ecs_macros = { path = "ecs_macros" }  # ECS 派生宏

# 场景系统
enum_dispatch = "0.3.13"

# 图像处理
image = { version = "0.25.10", default-features = false, features = ["png"] }

# 序列化
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bincode = "2.0"

# 压缩 (MLibrary 需要)
flate2 = "1.1.9"

# 字节序处理
byteorder = "1.5.0"

# 日志
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

# 工具库
once_cell = "1.21.4"
anyhow = "1.0.102"
bitflags = "2.11.0"
rand = "0.10.0"
dirs = "6.0.0"  # 用于获取用户数据目录

# 异步运行时和通道
tokio = { version = "1.51.1", features = ["sync"], optional = true }
crossbeam-channel = "0.5.15"

# 时间日期
chrono = "0.4.44"

# 文件对话框 (地图加载)
rfd = "0.17.2"
mimalloc = "0.1.48"

# IME support was merged upstream in miniquad PR #591 but not yet released on crates.io.
# Patch to git main branch for IME input support.
[patch.crates-io]
miniquad = { git = "https://github.com/not-fl3/miniquad.git" }

[features]
# Keep default feature set minimal.
default = []

# Experimental ECS-based rendering pipeline (MapRenderSystem/UIRenderSystem etc.).
# Mainline rendering currently uses `map_renderer/` + native UI, so keep this off by default.
ecs_rendering = []

# Optional async runtime support.
tokio = ["dep:tokio"]

# Compatibility flag for legacy ggez backend code paths.
# Currently not enabled by default.
backend-ggez = []

[profile.dev]
opt-level = 1


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
