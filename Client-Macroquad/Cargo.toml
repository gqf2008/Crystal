[package]
name = "client_macroquad"
version = "0.1.0"
edition = "2021"

[dependencies]
# Macroquad 核心
macroquad = "0.4"
macroquad-profiler = "0.2"
egui-macroquad = "0.17"  # egui GUI 库

# 共享库 (游戏协议和数据结构)
mir2_shared = { path = "../SharedRust", features = ["client-parse"] }

# ECS 系统
hecs = "0.10"
ecs_macros = { path = "ecs_macros" }  # ECS 派生宏

# 场景系统
enum_dispatch = "0.3"

# 图像处理
image = { version = "0.25", default-features = false, features = ["png"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
bincode = "2.0.1"

# 压缩 (MLibrary 需要)
flate2 = "1.1"

# 字节序处理
byteorder = "1"

# 日志
tracing = "0.1"

# 工具库
once_cell = "1.21"
anyhow = "1"
bitflags = "2.10"
rand = "0.9.2"

# 异步运行时和通道
tokio = { version = "1", features = ["sync"], optional = true }
crossbeam-channel = "0.5"

# 时间日期
chrono = "0.4"

# 文件对话框 (地图加载)
rfd = "0.15"

[profile.dev]
opt-level = 1


[[bin]]
name = "test_all_components"
path = "src/bin/test_all_components.rs"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
