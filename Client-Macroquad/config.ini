[Login]
Account=333
SavePassword=false
LastLogin=1763116807
Version=0.1.0
[Network]
UseMock=true
ServerAddr=127.0.0.1:7000
; 远程玩家移动插值时长（毫秒，按“每格/每步”计）。设置为 0 可禁用插值（恢复“瞬移”风格）。
; 注意：Run 包通常一次跨越 2 格，客户端会按跨越格数自动缩放时长。
RemoteInterpWalkMs=300
RemoteInterpRunMs=300

[Mock]
; 远程玩家数量（当 MassBattle=false 时生效）
; 当 MassBattle=true 时，实际刷新的玩家总数 = MassBattleTeamA + MassBattleTeamB
RemotePlayers=200

; 大规模群体战斗（两阵营远程玩家互砍）
MassBattle=false
MassBattleTeamA=500
MassBattleTeamB=500
MassBattleSpawnRadius=45
MassBattleEngageRange=10
MassBattleRespawnMs=3000
MassBattleAttackersPerTick=600
MassBattleBucket=6

; Boss（大怪）：在 MassBattle=true 时也会刷（只刷 Boss，不刷普通小怪）
BossEnabled=true
BossCount=1
; ObjectMonster.image（默认 902=Dragon）
BossImage=902
BossHP=6000
BossRespawnMs=25000
BossZoneRadius=10
BossAggroRange=14
BossDamageMin=18
BossDamageMax=35
BossAttackCooldownMs=1200

; 远程玩家外观/装备/特效随机范围（保证“每个都不一样”）
; 注意：仓库资源 Data/CWeapon 目前只有 00..78（>78 会导致武器贴图不存在，表现为“武器没了”）
WeaponMin=55
WeaponMax=78
; 注意：仓库资源 Data/CArmour 目前只有 00..58（>58 会导致盔甲贴图不存在，回退到裸装）
; 高编号盔甲通常是更炫酷的（如龙甲、天裳等）
ArmourMin=40
ArmourMax=58
; 武器特效：Data/CWeaponEffect 有 01..66，高编号通常更炫（发光/火焰等）
WeaponEffectMin=50
WeaponEffectMax=66
; 翅膀特效：Data/CHumEffect 有 00..05（共6种翅膀），全部启用
; wing_effect=1 对应 CHumEffect/00，以此类推
WingEffectMin=1
WingEffectMax=6

; 坐骑：等级>=1 时按概率随机一个 mount_type（范围内不同）
MountMinLevel=1
MountChance=0.5
; 注意：仓库资源 Data/Mount 目前只有 00..11（>11 会导致坐骑贴图不存在）
; 不同坐骑：0-6=马类，7=白虎，8-11=其他神兽
; 设置范围让玩家能看到各种炫酷坐骑
MountMin=0
MountMax=11