[package]
name = "mir2_shared"
version = "0.1.0"
edition = "2021"
authors = ["Crystal Porting Team"]
description = "Rust port of the Crystal Shared library used by client/server"
license = "MIT OR Apache-2.0"

[features]
default = []
client-parse = []  # Enable parse functions for ClientRust usage

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_repr = "0.1"
bitflags = { version = "2", features = ["serde"] }
thiserror = "1"
byteorder = "1"
num_enum = "0.7"
flate2 = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1"
