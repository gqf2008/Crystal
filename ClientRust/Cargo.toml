[package]
name = "mir2_client"
version = "0.1.0"
edition = "2021"
authors = ["Crystal Porting Team"]
description = "Experimental Rust rewrite of the Crystal Mir2 client"
license = "MIT OR Apache-2.0"

[package.metadata]
notes = "Work-in-progress port of the C# client."

[dependencies]
anyhow = "1"
arboard = "3.6.1"
bitflags = "2"
bincode = "2.0.1"
config = { version = "0.15.18", features = ["json", "yaml", "ini"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.33"
thiserror = "2.0.17"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
    "io-util",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "env-filter",
    "tracing-log",
] }
env_logger = "0.11"
url = "2"
winit = { version = "0.30.12", features = ["serde"] }
rodio = { version = "0.21.1", default-features = false, features = ["vorbis"] }
reqwest = { version = "0.12", features = ["json", "gzip", "stream"] }
bytes = "1"
parking_lot = "0.12"
rand = "0.9.2"
mir2_shared = { path = "../SharedRust", features = ["client-parse"] }
byteorder = "1"
md5 = "0.8.0"
wgpu = "27.0"  # 升级到最新版本
bytemuck = { version = "1.14", features = ["derive"] }  # For wgpu vertex data
flate2 = "1"  # GZip decompression for .lib files

# GUI Framework - egui for immediate-mode UI (升级到 0.32 以支持 wgpu 27)
egui = "0.32"
eframe = { version = "0.32", default-features = true, features = ["wgpu"] }
egui-wgpu = "0.32"

[dev-dependencies]
criterion = "0.7.0"
tempfile = "3"

[features]
default = ["client"]
client = []
