[package]
name = "mir2_client"
version = "0.1.0"
edition = "2021"
authors = ["Crystal Porting Team"]
description = "Experimental Rust rewrite of the Crystal Mir2 client"
license = "MIT OR Apache-2.0"

[package.metadata]
notes = "Work-in-progress port of the C# client."

[dependencies]
anyhow = "1"
arboard = "3.6.1"
bitflags = "2"
bincode = "2.0.1"
config = { version = "0.15.18", features = ["json", "yaml", "ini"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.33"
thiserror = "2.0.17"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
    "io-util",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "env-filter",
    "tracing-log",
] }
env_logger = "0.11"
url = "2"
reqwest = { version = "0.12", features = ["json", "gzip", "stream"] }
bytes = "1"
parking_lot = "0.12"
rand = "0.9.2"
mir2_shared = { path = "../SharedRust", features = ["client-parse"] }
byteorder = "1"
md5 = "0.8.0"
pollster = "0.4"  # 用于在同步代码中运行异步函数
flate2 = "1.1.3"  # GZip decompression for .lib files
once_cell = "1.21.3"
regex = "1.11.3"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"  # For Stream trait (used in downloader)
ggez = "=0.10.0-rc0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "wingdi"] }  # For Windows display resolution detection

# 完全移除 egui/eframe 依赖
# C# 原版使用自己的 GUI 系统（MirControls + DirectX 9），不依赖第三方 UI 框架
# Rust 版本也应该直接使用 wgpu + winit 实现，照搬原版设计

[dev-dependencies]
criterion = "0.7.0"
tempfile = "3"

[[bin]]
name = "mir2_client"
path = "src/main.rs"

[[bin]]
name = "mir2_client_ggez"
path = "src/main_ggez.rs"

[features]
default = ["client"]
client = []
