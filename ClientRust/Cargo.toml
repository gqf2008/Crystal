[package]
name = "mir2_client"
version = "0.1.0"
edition = "2021"
authors = ["Crystal Porting Team"]
description = "Experimental Rust rewrite of the Crystal Mir2 client"
license = "MIT OR Apache-2.0"

[package.metadata]
notes = "Work-in-progress port of the C# client."

[dependencies]
fory = "0.13.0"
anyhow = "1"
arboard = "3.6.1"
bitflags = "2.10.0"
bincode = "2.0.1"
config = { version = "0.15.18", features = ["json", "yaml", "ini"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.33"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
    "io-util",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "env-filter",
    "tracing-log",
] }
env_logger = "0.11"
url = "2"
reqwest = { version = "0.12", features = ["json", "gzip", "stream"] }
bytes = "1"
parking_lot = "0.12"
rand = "0.9.2"
crossbeam-channel = "0.5" # High-performance MPSC channels
mir2_shared = { path = "../SharedRust", features = ["client-parse"] }
byteorder = "1"
md5 = "0.8.0"
pollster = "0.4" # 用于在同步代码中运行异步函数
flate2 = "1.1.5" # GZip decompression for .lib files
once_cell = "1.21.3"
regex = "1.12.2"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3" # For Stream trait (used in downloader)
ecs_macros = { path = "ecs_macros" } # ECS系统派生宏

# ========== Bevy 0.17.2 (暂时禁用,使用 GGEZ + hecs 代替) ==========
# bevy = { version = "0.17.2", features = [
#     "dynamic_linking",            # 加快编译速度 (开发模式)
#     "experimental_bevy_feathers", # UI 组件库 (带样式主题)
#     "bevy_ui_debug",              # UI 调试工具
#     "custom_cursor",
#     "png",                        # PNG 图片支持
#     "jpeg",                       # JPEG 图片支持
#     "default_font",               # 默认字体 (ASCII)
# ] }

# ========== 渲染后端 (可选择) ==========
# 使用 feature flags 在 ggez 和 macroquad 之间切换
ggez = { version = "=0.10.0-rc0", optional = true }       # Includes winit re-export (use ggez::winit::*)
macroquad = { version = "0.4", optional = true }          # 跨平台游戏框架 (Web/Mobile/Desktop)
hecs = { version = "0.10.5", features = ["hecs-macros"] } # 轻量级高性能 ECS 库
rayon = "1.8"                                             # 并行执行 ECS 系统
# egui = "0.27"  # 暂时禁用,egui_ggez 不兼容 ggez 0.10-rc0
# egui_ggez = "0.3"  # 在 crates.io 上不存在或不兼容
assets_manager = "0.13.4"
rfd = "0.15" # File dialog for map selection
ron = "0.11.0"
tinyvec = { version = "1.10.0", features = ["alloc"] }
shlex = "1.3.0"
zerocopy = "0.8.27"
log = { version = "0.4.28", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
smallvec = { version = "1.13", features = ["union"] } # 栈上小数组优化，避免小集合的堆分配

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "wingdi",
] } # For Windows display resolution detection

# 完全移除 egui/eframe 依赖
# C# 原版使用自己的 GUI 系统（MirControls + DirectX 9），不依赖第三方 UI 框架
# Rust 版本也应该直接使用 wgpu + winit 实现，照搬原版设计

[dev-dependencies]
criterion = "0.7.0"
tempfile = "3"

[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"
# ========== 主程序入口 ==========
[[bin]]
name = "mir2x"
path = "src/bin/mir2x.rs"

# Bevy 版本 (新)
# [[bin]]
# name = "mir2_bevy"
# path = "src/bin/main_bevy.rs"

# Ggez 版本 (旧,保留用于参考)
# [[bin]]
# name = "mir2_client"
# path = "src/bin/main_ggez.rs"

# .lib 文件检查工具
# [[bin]]
# name = "lib_inspector"
# path = "lib_inspector.rs"

# 简化的地图查看器 - 使用 GameScene 的 MapRenderer
# [[bin]]
# name = "simple_map_viewer"
# path = "src/bin/simple_map_viewer.rs"

# 🆕 地图查看器 V2 - 使用 MapViewerScheduler (串行调度器)
# [[bin]]
# name = "map_viewer_v2"
# path = "src/bin/map_viewer_v2.rs"

# 🆕 地图查看器 - Macroquad 版本
[[bin]]
name = "map_viewer_macroquad"
path = "src/bin/map_viewer_macroquad.rs"
required-features = ["backend-macroquad"]

# 🆕 Macroquad 最小演示
[[bin]]
name = "demo_macroquad"
path = "src/bin/demo_macroquad.rs"
required-features = ["backend-macroquad"]

# # 中文输入法测试程序
# [[bin]]
# name = "test_chinese_ime"
# path = "src/bin/test_chinese_ime.rs"

# # 最小化 IME 测试(诊断用)
# [[bin]]
# name = "test_ime_minimal"
# path = "src/bin/test_ime_minimal.rs"

# [[bin]]
# name = "test_ime_fixed"
# path = "src/bin/test_ime_fixed.rs"

# [[bin]]
# name = "test_egui_ime"
# path = "src/bin/test_egui_ime.rs"

# [[bin]]
# name = "test_clipboard"
# path = "src/bin/test_clipboard.rs"

# # 完整 IME 支持 - 使用自定义事件循环
# [[bin]]
# name = "test_ime_custom_loop"
# path = "src/bin/test_ime_custom_loop.rs"

[features]
default = ["client", "backend-ggez"]
client = []
# 渲染后端选择 (互斥)
backend-ggez = ["ggez"]
backend-macroquad = ["macroquad"]
