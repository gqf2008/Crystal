[package]
name = "client_bevy"
version = "0.1.0"
edition = "2021"
description = "Legend of Mir 2 (传奇2) 游戏客户端 — Bevy 移植版（由 Client-Macroquad 迁移）"

[dependencies]
# Bevy 游戏引擎 0.19（ECS/渲染大幅升级）
bevy = { version = "0.19", features = ["wav"] }
# B0001 调试：显示冲突系统/组件名
bevy_ecs = { version = "0.19", features = ["debug"] }
# 排版库（bevy_text 同版传递依赖）：直接访问 fontique Collection 注册系统宋体并设
# Han 字形回退（复刻 C# GDI 字体链接 Arial→宋体；见 ui/sprite_ui.rs setup_han_fallback_system）。
# default-features=false：只要核心 Collection API——默认特性 system 会在 Linux 拉
# fontconfig 硬依赖，弄红 CI（bevy_text 用 fontique 时本就没启用这些）
parley = { version = "0.9", default-features = false, features = ["std"] }

# 共享库 (游戏协议和数据结构)
mir2_shared = { path = "../SharedRust", features = ["client-parse"] }

# 数据解析
byteorder = "1"
flate2 = "1"

# 图像处理（调试导出 PNG）
image = { version = "0.25", default-features = false, features = ["png"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# 工具
anyhow = "1"
once_cell = "1"
crossbeam-channel = "0.5"
serde_json = "1"
chrono = "0.4"

[profile.dev]
opt-level = 1
# 调试信息只保留行号（完整 debug 信息导致 exe 2GB+ 超出 Windows 加载器限制）
debug = 1

# 依赖包使用完整优化，避免调试构建太慢
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# 仅保留 parley 本地补丁：上游 0.9.0 的 word/line_segmenter 用
# new_for_non_complex_scripts（不加载 CJK 词典 → 中文/日文不渲染），改为 new_auto。
# 注：winit 曾被打本地补丁恢复 WM_IME_SETCONTEXT，但 winit 0.30.13 上游已含该修复
# （changelog v0.30.13），且本地 vendor 与 crates.io 同版本、无本地改动，故已移除。
[patch.crates-io]
parley = { path = "vendor/parley" }

