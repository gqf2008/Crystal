[package]
name = "client_bevy"
version = "0.1.0"
edition = "2021"
description = "Legend of Mir 2 (传奇2) 游戏客户端 — Bevy 移植版（由 Client-Macroquad 迁移）"

[dependencies]
# Bevy 游戏引擎 0.19（ECS/渲染大幅升级）
bevy = "0.19"
# B0001 调试：显示冲突系统/组件名
bevy_ecs = { version = "0.19", features = ["debug"] }

# 共享库 (游戏协议和数据结构)
mir2_shared = { path = "../SharedRust", features = ["client-parse"] }

# 数据解析
byteorder = "1"
flate2 = "1"

# 图像处理（调试导出 PNG）
image = { version = "0.25", default-features = false, features = ["png"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# 工具
anyhow = "1"
once_cell = "1"
crossbeam-channel = "0.5"
chrono = "0.4"

# Windows TSF（输入法候选词）—— 仅 windows target 需要
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_TextServices",
    "Win32_System_Com",
    "Win32_Foundation",
] }
# windows 0.62 的 #[implement] 宏展开引用 ::windows_core 绝对路径，需直接依赖
windows-core = "0.62"

[profile.dev]
opt-level = 1
# 调试信息只保留行号（完整 debug 信息导致 exe 2GB+ 超出 Windows 加载器限制）
debug = 1

# 依赖包使用完整优化，避免调试构建太慢
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Windows 中文 IME 修复：winit 0.30 在 Windows 上屏蔽了 IME 原生组合窗/候选窗，
# 假设应用用 Ime::Preedit 自绘；但中文 IME 经 GCS_COMPSTR 给的只是占位空格，
# 真实拼音在 IME 自己的候选窗里（被 winit 吞了），导致"盲打"。
# 本补丁恢复 WM_IME_SETCONTEXT / WM_IME_COMPOSITION 的 DefWindowProc，
# 让原生候选窗正常弹出。见 ../vendor/winit-0.30.13 内 [CRYSTAL PATCH] 注释。
[patch.crates-io]
winit = { path = "../vendor/winit-0.30.13" }
